name: build
on:
  workflow_dispatch:
  workflow_run:
    workflows: [tests]
    types: [completed]

jobs:
  build:
    name: Build application image
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      branch: ${{ steps.branch.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract branch name
        id: branch
        run: |
          TMP_PULL_HEAD_REF="${{ github.head_ref }}"
          TMP_GITHUB_REF="${GITHUB_REF#refs/heads/}"
          GIT_BRANCH=""
          if [ "${TMP_PULL_HEAD_REF}" != "" ]
          then
              GIT_BRANCH="${TMP_PULL_HEAD_REF}"
          else
              GIT_BRANCH="${TMP_GITHUB_REF}"
          fi

          if [[ $GIT_BRANCH == feature/* ]]; then
            BRANCH="${GIT_BRANCH##*/}"
          elif [[ $GIT_BRANCH == main ]] || [[ $GIT_BRANCH == dev ]] || [[ $GIT_BRANCH == stage ]]; then
            BRANCH="$GIT_BRANCH"
          else
            BRANCH=""
          fi

          echo "name=$BRANCH" >> $GITHUB_OUTPUT
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ secrets.DOCKER_USERNAME }}/budget-tracker
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test
        env:
          APP_KEY: base64:ZDvM4VCsq2LjMjVmEUL1hptH1kVBpQLIIST511DwCmc=
        run: |
          docker compose up --wait --wait-timeout 60s -d --no-build
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
